services:
  app:
    build: ./app
    ports:
      - 8080:8080
    volumes:
      - ./app/:/app
      - /app/node_modules
      - /app/.pnpm-store
  prometheus:
    build: ./prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  grafana-data:
